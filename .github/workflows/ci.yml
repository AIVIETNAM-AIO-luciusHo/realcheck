name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Huỷ lượt chạy cũ khi đẩy commit mới lên cùng nhánh
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.17.3 # khớp requirements.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r streamlit/requirements.txt
      # Không còn bước bỏ qua: thiếu test thì pytest exit 5 và job fail
      - run: pytest --cov=app --cov-fail-under=70

  # Job duy nhất Ruleset cần yêu cầu: required check = "ci-ok"
  ci-ok:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs must succeed
        run: |
          [ "${{ needs.lint.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ]
