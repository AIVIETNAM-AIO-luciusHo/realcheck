# Gateway RealCheck: cổng public duy nhất, route API trước UI, rate limit và lỗi theo D05.
# Giá trị theo docs/decisions/realcheck-baseline.md (D05, D06, D11, D13; Lực duyệt 2026-11-12);
# đổi ở đây thì đổi cả sổ quyết định, nginx/README.md và ERROR_TABLE trong app/errors.py.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    default_type application/octet-stream;
    charset utf-8;
    charset_types application/json;

    # Docker DNS; phân giải lại mỗi 10 giây để container API/UI khởi động lại (đổi IP) vẫn tới được.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Container đã dừng thì tên không phân giải được; không đặt thì mỗi request chờ khoảng 4 giây mới 502.
    resolver_timeout 1s;

    # Request ID: giữ UUID hợp lệ client gửi, ngược lại tạo mới; API nhận cùng ID qua X-Request-ID.
    map $request_id $generated_request_id {
        "~^(?<a>[0-9a-f]{8})(?<b>[0-9a-f]{4})(?<c>[0-9a-f]{4})(?<d>[0-9a-f]{4})(?<e>[0-9a-f]{12})$" "$a-$b-$c-$d-$e";
    }
    map $http_x_request_id $realcheck_request_id {
        "~^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" $http_x_request_id;
        default $generated_request_id;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    log_format realcheck '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                         'request_id=$realcheck_request_id request_time=$request_time '
                         'upstream_time=$upstream_response_time';
    access_log /var/log/nginx/access.log realcheck;

    # D13: 10 request/giây theo IP kết nối thật, không tin X-Forwarded-For của client.
    limit_req_zone $binary_remote_addr zone=analyze:10m rate=10r/s;
    limit_req_status 429;

    server {
        listen 80;

        # D06: file tối đa 5.242.880 byte do API kiểm; body dư 64 KiB cho header multipart.
        client_max_body_size 5184k;

        set $api_upstream http://api:8000;
        set $ui_upstream http://ui:8501;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $realcheck_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Lỗi do chính gateway tạo; lỗi của API (kể cả 413, 504 MODEL_TIMEOUT) đi qua nguyên vẹn.
        error_page 413 @file_too_large;
        error_page 429 @rate_limited;
        error_page 502 503 @api_unavailable;
        error_page 504 @gateway_timeout;

        location /v1/ {
            # D13: cho dồn 10 request rồi trả 429 ngay, không xếp hàng.
            limit_req zone=analyze burst=10 nodelay;
            # D11: model 10 giây (approved tạm); gateway 15 giây (approved 2026-11-12), UI 60 giây.
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            proxy_pass $api_upstream;
        }

        location ~ ^/(health|docs|openapi\.json)$ {
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_pass $api_upstream;
        }

        location /_stcore/stream {
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $realcheck_request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass $ui_upstream;
        }

        location / {
            proxy_read_timeout 60s;
            proxy_pass $ui_upstream;
        }

        location @file_too_large {
            default_type application/json;
            add_header X-Request-ID $realcheck_request_id always;
            return 413 '{"error":{"code":"FILE_TOO_LARGE","message":"File ảnh vượt quá dung lượng cho phép.","request_id":"$realcheck_request_id"}}';
        }

        location @rate_limited {
            default_type application/json;
            add_header X-Request-ID $realcheck_request_id always;
            add_header Retry-After 1 always;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Đang có quá nhiều yêu cầu. Vui lòng đợi một lát rồi thử lại.","request_id":"$realcheck_request_id"}}';
        }

        location @api_unavailable {
            default_type application/json;
            add_header X-Request-ID $realcheck_request_id always;
            return 502 '{"error":{"code":"API_UNAVAILABLE","message":"Hệ thống phân tích chưa sẵn sàng. Vui lòng thử lại sau.","request_id":"$realcheck_request_id"}}';
        }

        location @gateway_timeout {
            default_type application/json;
            add_header X-Request-ID $realcheck_request_id always;
            return 504 '{"error":{"code":"GATEWAY_TIMEOUT","message":"Hệ thống xử lý quá lâu. Vui lòng thử lại sau.","request_id":"$realcheck_request_id"}}';
        }
    }
}
